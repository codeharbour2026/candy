<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell some candy — The Candy Bowl</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js" defer></script><script src="script.js" defer></script></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">🍬</span><span>The Candy Bowl</span></a><nav class="nav-links" data-auth-links><a href="rules.html">Rules</a><a href="signin.html">Sign in</a><a class="button" href="signup.html">Join</a></nav></div></header><main class="container"><div class="page-title"><span class="eyebrow">The Candy Bowl</span><h1>Sell some candy</h1></div><section class="content"><div class="form-card narrow"><p class="muted">Only list items allowed by your school. Be accurate about packaging and allergens.</p><form id="create-listing-form"><div class="field"><label for="name">Candy name</label><input id="name" name="name" maxlength="90" required></div><div class="field"><label for="description">Description</label><textarea id="description" name="description" maxlength="1200" placeholder="Describe the product and package size"></textarea></div><div class="two-col"><div class="field"><label for="category">Category</label><select id="category" name="category" required><option value="">Choose one</option><option>Chocolate</option><option>Lollies</option><option>Gummies</option><option>Mints</option><option>Chewing gum</option><option>Biscuits and sweets</option><option>Candy bundles</option><option>Other</option></select></div><div class="field"><label for="price">Price per unit (AUD)</label><input id="price" name="price" type="number" min=".01" step=".01" required></div></div><div class="two-col"><div class="field"><label for="quantity_available">Quantity available</label><input id="quantity_available" name="quantity_available" type="number" min="1" step="1" required></div><div class="field"><label for="image_url">Image URL (optional)</label><input id="image_url" name="image_url" type="url" placeholder="https://…"></div></div><div class="field"><label for="allergen_information">Allergens / ingredients info</label><textarea id="allergen_information" name="allergen_information" maxlength="1000" placeholder="Use package information; don't guess."></textarea></div><button type="submit">Publish listing</button></form><div id="form-message" class="hidden"></div></div></section></main><footer class="footer"><div class="container footer-inner"><span>Cash handovers only · No online payments</span><span><a href="index.html">Marketplace</a> · <a href="rules.html">Rules & safety</a></span></div></footer></body></html>
